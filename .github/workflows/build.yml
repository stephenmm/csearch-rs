name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: only the release job needs to write. A fork's pull request
# gets a read-only token regardless, but keeping the default at `read` means a
# future job cannot quietly inherit write access to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A required status check (see branch protection) that blocks the merge
  # button on a PR whose Cargo.toml version has not moved. It cannot stop a
  # direct `git push` to main -- GitHub has no server-side hook for that on
  # github.com -- only PRs going through the merge button.
  version-check:
    name: version-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Compare against the PR base
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git show "${{ github.event.pull_request.base.sha }}:Cargo.toml" > /tmp/base-Cargo.toml
          python3 .github/scripts/check_version_bump.py /tmp/base-Cargo.toml Cargo.toml

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl links fully static: no glibc version floor, runs on any distro.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rustflags: ""
          # +crt-static drops the VC++ redistributable dependency.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-feature=+crt-static"
          # Native builds on each architecture's own hardware, matching
          # ripgrep's own release layout: separate per-arch tarballs, not a
          # lipo-combined universal2 binary.
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            rustflags: ""
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            rustflags: ""

    steps:
      - uses: actions/checkout@v7

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # Lint before testing so a style or clippy failure surfaces in seconds.
      # fmt is platform-independent, so once is enough; clippy runs on both
      # legs because cfg(windows) code is only linted where it compiles.
      - name: Lint components
        run: rustup component add clippy rustfmt

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      # Assert the binaries really are standalone, rather than trusting the flag.
      - name: Verify static (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          for b in cindex csearch; do
            file "$b"
            file "$b" | grep -q 'static-pie linked\|statically linked' \
              || { echo "FAIL: $b is not statically linked"; exit 1; }
            ./"$b" --version
          done
          echo "PASS: both binaries are statically linked"

      - name: Verify no CRT imports (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
                     Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          foreach ($b in 'cindex', 'csearch') {
            $exe = "target/${{ matrix.target }}/release/$b.exe"
            $out = & $dumpbin.FullName /dependents $exe
            $crt = $out | Select-String -Pattern 'vcruntime|api-ms-win-crt|msvcp'
            if ($crt) { Write-Error "FAIL: $b.exe imports the C runtime: $crt" }
            & $exe --version
          }
          Write-Output "PASS: no C-runtime imports"

      # macOS always links libSystem, unlike Linux/Windows that has no
      # equivalent redistributable concern; what's worth asserting is that
      # nothing from Homebrew or elsewhere crept into the dependency tree.
      - name: Verify it runs and links only system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          for b in cindex csearch; do
            file "$b"
            otool -L "$b"
            if otool -L "$b" | tail -n +2 | awk '{print $1}' | grep -qvE '^(/usr/lib/|/System/)'; then
              echo "FAIL: $b links something outside the system libraries"
              exit 1
            fi
            ./"$b" --version
          done
          echo "PASS: both binaries run and link only system libraries"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # BSD-3-Clause condition 2: binaries must ship the notice too.
          cp LICENSE README.md target/${{ matrix.target }}/release/
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../../../dist/csearch-rs-${{ matrix.name }}.zip" \
              cindex.exe csearch.exe LICENSE README.md
          else
            strip cindex csearch || true
            tar czf "../../../dist/csearch-rs-${{ matrix.name }}.tar.gz" \
              cindex csearch LICENSE README.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: csearch-rs-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "csearch-rs ${GITHUB_REF_NAME}" \
            --notes "Standalone binaries, no installer or redistributable needed. Linux (static musl, any distro), Windows (static CRT), macOS Apple Silicon and Intel (unsigned -- right-click > Open on first run)." \
            --verify-tag
