[package]
name = "csearch-rs"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Rust port of Google Code Search (cindex/csearch) with SIMD trigram extraction and parallel indexing/search"
license = "BSD-3-Clause"

[lib]
name = "csearch"
path = "src/lib.rs"

# The binaries are not called `cindex` and `csearch`: those names, like
# `$CSEARCHINDEX` and `~/.csearchindex`, belong to the original, which this is
# meant to be installable next to. See src/names.rs.
[[bin]]
name = "cindex-rs"
path = "src/bin/cindex.rs"

[[bin]]
name = "csearch-rs"
path = "src/bin/csearch.rs"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.4.18", features = ["derive"] }
memchr = "2.7.4"
memmap2 = "0.9.4"
rayon = "1.10.0"
regex = "1.10.6"
regex-syntax = "0.8.4"
walkdir = "2.5.0"

# flock(2), for the refresh lock. Already in the tree by way of memmap2; on
# Windows the lock needs nothing beyond std.
[target.'cfg(unix)'.dependencies]
libc = "0.2.155"

[dev-dependencies]
tempfile = "3.10.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
